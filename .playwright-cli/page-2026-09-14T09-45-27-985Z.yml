      - paragraph [ref=e304]: Use a unique filter ID for every instance. Otherwise two examples on the same page can quietly use each other’s filter. The fixed viewBox lets this graph resize with its container. For a live chart, keep the seed attached to the series and rebuild the geometry when its data changes.
      - paragraph [ref=e305]: I like this at the size of a margin note or a small illustration. Keep labels crisp, give the paper room, and let a few marks do the work. My browser tabs have supplied enough growth for one chart.
