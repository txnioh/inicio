              - heading "Descripción" [level=3] [ref=f1e658]
              - paragraph [ref=f1e659]: "ABOUT THE ROLE: The Founding Commercial Systems Engineer is the first dedicated engineer for Rightway’s commercial organization. We’ve synthesized a strong commercial stack including Salesforce, Highspot, Gong, Tribble, and other tools — but we’ve never had a technical role to build on top of it, connect it, and push it further. That’s this role. You’ll architect and build the tooling, automation, and AI that our commercial teams run on, turning the systems we already have into a connected engine that helps the business sell, retain, and grow. It’s a rare first-engineer opportunity: the foundation is in place, and you get to build the layer that makes it exceptional. WHAT YOU’LL DO: Own and build our commercial systems. Be the technical owner of Salesforce and our commercial stack — architecting it, wiring the tools together, and writing the code that configuration can’t handle (Apex, Lightning/LWC, APIs) to build custom tooling and integrations. This end-to-end ownership is what gives you the vantage point to fix what’s underneath. Make our data trustworthy. Use that ownership to get our commercial data clean, consistent, and reliable — building whatever it takes (automations, controls, standards, pipelines) to fix it at the source and keep it that way — then feed it into the company’s central warehouse, partnering with Data & Insights on what’s captured and how it’s used. Trustworthy data is the bedrock everything else is built on. Build the tools that give reps and client success teams an edge. Ship the automation and AI that make the team sharper and faster — deal briefs that assemble everything known about an opportunity, finalist prep, renewal-risk alerts for Client Success, and AI agents that surface at-risk deals and next steps on their own. Grow the function. Potential to mentor and manage a team member over time, and help shape how the commercial engineering function grows as the business scales. WHO YOU ARE: A hands-on builder who can independently own systems, data, and tooling end to end Deeply experienced in Salesforce (5+ years), with at least 3 writing Apex in production Salesforce certifications (Platform Developer I/II, Administrator) Owned a production integration between Salesforce and an external system Shipped Lightning Web Components used daily by a sales or client success team AI-forward and curious — you actively explore and build with new tools, including AI and automation. You have shipped an AI powered tool a business team actua"
